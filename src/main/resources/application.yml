spring:
  application:
    name: matching-engine

  datasource:
    url: jdbc:postgresql://localhost:5432/matching_engine
    username: matching
    password: matching
    hikari:
      pool-name: matching-engine-pool
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    generator:
      # Otherwise a zeroed BigDecimal serialises as "0E-8" instead of "0.00000000".
      write-bigdecimal-as-plain: true

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.harshshah.matchingengine: INFO
