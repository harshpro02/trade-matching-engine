spring:
  application:
    name: matching-engine

  datasource:
    url: jdbc:postgresql://localhost:5432/matching_engine
    username: matching
    password: matching
    hikari:
      pool-name: matching-engine-pool
      maximum-pool-size: 10

  jpa:
    # Flyway owns the schema. Hibernate is only allowed to check that the classes and the
    # tables agree, never to change anything: a schema that silently mutates on deploy is
    # how you lose data in production.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.harshshah.matchingengine: DEBUG
